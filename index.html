<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>League of Memory - LOM</title>
    <meta name="description" content="A futuristic, 6-player turn-based strategy memory game for World App.">
    <!-- World ID SDK -->
    <script src="https://unpkg.com/@worldcoin/idkit@1.3.0/build/idkit-js.js"></script>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Start/Verify Overlay -->
    <div id="start-overlay" class="modal-overlay" style="opacity:1; pointer-events:auto; z-index:999;">
        <div class="modal-content">
            <h1 class="glow-text" style="font-size:3rem; margin-bottom:10px;">LOM</h1>
            <p>League of Memory</p>
            <div style="margin: 20px 0; font-size: 0.9rem; color: #888;">
                Proof of Personhood Required
            </div>
            <button id="verify-btn" class="neon-btn">Verify with World ID</button>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="game-header" role="banner">
            <h1 class="glow-text">LOM</h1>
            <div class="game-status" id="game-status" aria-live="polite">Waiting to start...</div>
        </header>

        <!-- Main Game Area -->
        <main class="arena-container">

            <!-- Players Sidebar -->
            <aside class="players-panel" id="players-panel" aria-label="Player Scores and Status">
                <!-- Player slots generated by JS -->
            </aside>

            <!-- 6x6 Grid -->
            <section class="game-grid-wrapper" aria-label="Game Board">
                <div class="game-grid" id="game-grid" role="grid">
                    <!-- Cards generated by JS -->
                </div>

                <!-- Turn Timer Overlay -->
                <div class="turn-timer-bar" role="progressbar" aria-label="Turn Timer">
                    <div class="timer-fill" id="timer-fill"></div>
                </div>
            </section>

        </main>

        <!-- Power Deck -->
        <footer class="power-deck-container" role="contentinfo">
            <div class="deck-label">POWER DECK</div>
            <div class="power-cards" id="power-cards" role="toolbar" aria-label="Power Cards">
                <!-- Power cards generated by JS -->
            </div>
        </footer>

        <!-- Game Over Modal -->
        <div id="modal-overlay" class="modal-overlay hidden" aria-modal="true" role="dialog"
            aria-labelledby="modal-title">
            <div class="modal-content">
                <h2 id="modal-title">Game Over</h2>
                <p id="modal-body">Winner: ...</p>
                <button id="modal-btn" class="neon-btn">NEW GAME</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
